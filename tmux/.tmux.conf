unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g prefix2 M-Space
bind M-Space send-prefix -2

set -sg escape-time 0
set -g repeat-time 300
set -g focus-events on

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:extkeys"
set -as terminal-features ",*:hyperlinks"

set -s extended-keys on
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -s set-clipboard on
if-shell "command -v wl-copy >/dev/null 2>&1" 'set -s copy-command "wl-copy"'

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

set -g detach-on-destroy off

setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
set -g allow-rename off

setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

set -g status-style "bg=#eaeef2,fg=#000000"
set -g status-left "#[bg=#000000,fg=#ffffff,bold] #S #[bg=#eaeef2,fg=#000000,nobold] "
set -g status-right "#[fg=#57606a]#{pane_current_command} #[fg=#8c959f]│ #[fg=#000000,bold]%H:%M "

setw -g window-status-separator ""
setw -g window-status-style "bg=#eaeef2,fg=#57606a"
setw -g window-status-format " #I:#W "

setw -g window-status-current-style "bg=#ffffff,fg=#000000,bold"
setw -g window-status-current-format " [#I:#W#{?window_zoomed_flag, Z,}] "

set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style "fg=#afb8c1"
set -g pane-active-border-style "fg=#0969da"

set -g popup-style "bg=#ffffff,fg=#000000"
set -g popup-border-style "fg=#000000"
set -g popup-border-lines single

set -g message-style "bg=#000000,fg=#ffffff,bold"
set -g message-command-style "bg=#000000,fg=#ffffff"
set -g mode-style "bg=#0969da,fg=#ffffff,bold"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

bind Space last-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind $ command-prompt -I "#S" "rename-session '%%'"
bind C-n new-window -n nvim -c "#{pane_current_path}" nvim

bind x kill-pane
bind & confirm-before -p "Kill window #W? (y/n)" kill-window

bind S setw synchronize-panes \; display-message "SYNC: #{?pane_synchronized,ON,OFF}"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

setw -g mode-keys vi

bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle \; send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi g send -X history-top
bind -T copy-mode-vi G send -X history-bottom

bind C-p display-popup -E -w 90% -h 90% \
  "tmux capture-pane -S -5000 -p | sed -e 's/[[:space:]]*$//' | nvim -R -c 'setlocal buftype=nofile bufhidden=wipe noswapfile nonumber norelativenumber' -c 'normal! G' -"

bind C-t display-popup -d "#{pane_current_path}" -E -w 85% -h 85%

bind ? display-popup -E -w 80% -h 80% "tmux list-keys | less -R"
