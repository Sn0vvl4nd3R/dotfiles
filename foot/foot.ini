[main]
term=xterm-256color
font=Iosevka Term:size=10, Symbols Nerd Font Mono:size=10, Noto Color Emoji:size=10
font-bold=Iosevka Term:weight=bold:size=10, Symbols Nerd Font Mono:size=10, Noto Color Emoji:size=10
font-italic=Iosevka Term:slant=italic:size=10, Symbols Nerd Font Mono:size=10, Noto Color Emoji:size=10
font-bold-italic=Iosevka Term:weight=bold:slant=italic:size=10, Symbols Nerd Font Mono:size=10, Noto Color Emoji:size=10

pad=6x6 center
resize-by-cells=no
initial-color-theme=light

[environment]
COLORTERM=truecolor

[csd]
preferred=none
size=0
border-width=0

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[bell]
urgent=yes
notify=no
visual=no

[colors-light]
alpha=1.0
background=ffffff
foreground=000000
cursor=ffffff 000000

selection-foreground=000000
selection-background=d0d7de

search-box-no-match=ffffff cf222e
search-box-match=000000 eaeef2
jump-labels=ffffff 0969da
urls=0969da

regular0=000000
regular1=cf222e
regular2=116329
regular3=9a6700
regular4=0969da
regular5=8250df
regular6=0550ae
regular7=57606a

bright0=57606a
bright1=a40e26
bright2=0f5323
bright3=7d4e00
bright4=0550ae
bright5=6639ba
bright6=033d8b
bright7=212529

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[search-bindings]
cancel=Escape Control+c
commit=Return
delete-to-end=none
find-prev=Control+k Control+p Up
find-next=Control+j Control+n Down
