[main]
font=Iosevka Term:size=11:weight=bold
dpi-aware=no
icons-enabled=no
prompt="> "
terminal=foot -e

width=36
lines=10
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=22
exit-on-keyboard-focus-loss=yes

[colors]
background=ffffffff
text=57606aff
prompt=000000ff
input=000000ff
match=0969daff
selection=000000ff
selection-text=ffffffff
selection-match=58a6ffff
border=000000ff

[border]
width=2
radius=0

[key-bindings]
cancel=Escape Control+c
execute=Return KP_Enter
prev=Up Control+k Control+p
next=Down Control+j Control+n
delete-word=Control+w Control+BackSpace
delete-line-backward=Control+u
